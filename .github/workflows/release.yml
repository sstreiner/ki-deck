# Builds and publishes a ki-deck release on a GitHub-hosted Mac, with the same script as a release
# built on your own Mac (.github/scripts/release.sh, `make publish`).
#
#   Actions > Release > Run workflow   tag empty: builds the chosen branch, files only on the run;
#                                      a tag such as v0.12.0: builds that tag and creates its
#                                      release, or replaces the files of an existing one
#
# Releasing on every pushed tag is switched off for now: releases are built locally. To turn it
# on, remove the comment marks in front of `push:` and `tags:` below.
# Standard GitHub-hosted runners cost nothing in public repositories; in a private one, a macOS
# minute uses ten of the free plan's monthly minutes.
name: Release

on:
  # push:
  #   tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.12.0. Leave empty to only build (files on the run, no release)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its files
    env:
      # A pushed tag, the tag given to a manual run, or empty for a build without a release.
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      # The chosen branch (or the pushed tag) with every tag: the script comes from here and builds
      # the tag in a worktree of its own, as it does on a Mac.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No dependency cache: a release builds from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build and publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TAG" ]; then
            .github/scripts/release.sh "$TAG"
          else
            .github/scripts/release.sh --build-only
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ki-deck-${{ steps.release.outputs.version }}
          path: |
            dist/ki-deck-${{ steps.release.outputs.version }}.pkg
            dist/net.streiner.ki-deck.streamDeckPlugin
            dist/HANDBOOK.pdf
            dist/SHA256SUMS
          if-no-files-found: error
