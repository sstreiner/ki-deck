# Builds ki-deck on a GitHub-hosted Mac with `make release` (typecheck, tests, validation, the
# plugin, the installer package, the handbook PDF and SHA256SUMS) and publishes the files.
#
#   git tag v0.12.0 && git push origin v0.12.0    builds that tag and creates its release
#   Actions > Release > Run workflow               tag empty: builds the chosen branch, files only on
#                                                  the run; a tag such as v0.12.0: builds that tag and
#                                                  creates its release, or replaces the files of an
#                                                  existing one
#
# The tag has to be "v" plus the version in package.json (`make version V=0.12.0` sets it).
# Standard GitHub-hosted runners cost nothing in public repositories; in a private one, a macOS
# minute uses ten of the free plan's monthly minutes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.12.0. Leave empty to only build (files on the run, no release)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its files
    env:
      # A pushed tag, the tag given to a manual run, or empty for a build without a release.
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Check the tag
        if: env.TAG != ''
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a release tag like v0.12.0"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG != '' && format('refs/tags/{0}', env.TAG) || github.ref }}
          persist-credentials: false

      # No dependency cache: a release builds from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json ($version): run make version V=${TAG#v}, commit, and tag again"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build and test (make release)
        run: make release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ki-deck-${{ steps.version.outputs.version }}
          path: |
            dist/ki-deck-${{ steps.version.outputs.version }}.pkg
            dist/net.streiner.ki-deck.streamDeckPlugin
            dist/HANDBOOK.pdf
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=("dist/ki-deck-$VERSION.pkg" dist/net.streiner.ki-deck.streamDeckPlugin dist/HANDBOOK.pdf dist/SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            echo "Replaced the files of release $TAG"
            exit 0
          fi
          notes="**Install:** open \`ki-deck-$VERSION.pkg\` (installs for your user, no administrator password), or double-click \`net.streiner.ki-deck.streamDeckPlugin\` to install through Stream Deck. \`HANDBOOK.pdf\` explains every key; \`SHA256SUMS\` has the checksums."
          if ! pkgutil --check-signature "dist/ki-deck-$VERSION.pkg" >/dev/null 2>&1; then
            notes+=$'\n\n'"The package is not signed: macOS blocks it on the first try. Then choose **Open Anyway** in System Settings > Privacy & Security."
          fi
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "ki-deck $VERSION" --notes "$notes" --generate-notes
